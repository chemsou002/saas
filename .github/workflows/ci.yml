name: ci

on:
  push:
  pull_request:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test -c Release

  windows-smoke:
    # Exercises the real Win32 power APIs on a Windows VM. A VM has no lid or battery, so this checks
    # detection, the power request, restore and crash recovery — not closed-lid behaviour.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test -c Release
      - run: dotnet publish src/Nightshift.Poc -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o out
      - name: detect
        shell: pwsh
        run: |
          ./out/nightshift-poc.exe detect
          ./out/nightshift-poc.exe detect --json --no-powercfg | Out-File detect-before.json
      - name: session holds a system-required power request, then restores
        shell: pwsh
        run: |
          $p = Start-Process ./out/nightshift-poc.exe -ArgumentList 'session','--duration','25s','--launch-heartbeat','--ack-ventilation','--display-off','idle-timeout' -PassThru -NoNewWindow -RedirectStandardOutput session.txt
          Start-Sleep -Seconds 10
          $requests = powercfg /requests | Out-String
          Write-Output $requests
          $p.WaitForExit()
          Get-Content session.txt
          if ($requests -notmatch 'nightshift-poc') { throw 'Power request not visible in powercfg /requests' }
          if ($p.ExitCode -ne 0) { throw "session exited with $($p.ExitCode)" }
          ./out/nightshift-poc.exe detect --json --no-powercfg | Out-File detect-after.json
          $before = (Get-Content detect-before.json | ConvertFrom-Json).settings | ConvertTo-Json -Depth 5
          $after  = (Get-Content detect-after.json  | ConvertFrom-Json).settings | ConvertTo-Json -Depth 5
          if ($before -ne $after) { throw "Settings not restored.`nBefore: $before`nAfter: $after" }
      - name: crash recovery
        shell: pwsh
        run: |
          $p = Start-Process ./out/nightshift-poc.exe -ArgumentList 'session','--duration','10m','--ack-ventilation','--display-off','idle-timeout' -PassThru -NoNewWindow
          Start-Sleep -Seconds 6
          Stop-Process -Id $p.Id -Force
          Start-Sleep -Seconds 1
          ./out/nightshift-poc.exe status
          ./out/nightshift-poc.exe restore
          if ($LASTEXITCODE -ne 0) { throw 'restore failed' }
          ./out/nightshift-poc.exe detect --json --no-powercfg | Out-File detect-final.json
          $before = (Get-Content detect-before.json | ConvertFrom-Json).settings | ConvertTo-Json -Depth 5
          $final  = (Get-Content detect-final.json  | ConvertFrom-Json).settings | ConvertTo-Json -Depth 5
          if ($before -ne $final) { throw "Settings not restored after crash.`nBefore: $before`nAfter: $final" }
      - name: "phase 2: install service, drive sessions over IPC, crash recovery, uninstall"
        shell: pwsh
        run: |
          dotnet publish src/Nightshift.Service -c Release -r win-x64 --self-contained true -o out/service
          dotnet publish src/Nightshift.Ctl -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o out/ctl
          ./installer/install-service.ps1 -Source out/service -CtlSource out/ctl
          $ctl = Join-Path $env:ProgramFiles 'Nightshift\nightshiftctl.exe'
          function Settings { (./out/nightshift-poc.exe detect --json --no-powercfg | ConvertFrom-Json).settings | ConvertTo-Json -Depth 5 }
          function Ctl { & $ctl @args; if ($LASTEXITCODE -ne 0) { throw "nightshiftctl $args failed ($LASTEXITCODE)" } }
          $before = Settings
          Ctl system

          Ctl start --duration 10m --ack-ventilation
          $requests = powercfg /requests | Out-String
          Write-Output $requests
          if ($requests -notmatch 'Nightshift') { throw 'Service power request not visible in powercfg /requests' }
          Ctl pause
          if ((Settings) -ne $before) { throw 'Settings not restored on pause' }
          Ctl resume
          Ctl status
          Ctl stop
          if ((Settings) -ne $before) { throw 'Settings not restored on stop' }

          # Unexpected termination: kill the service process; the SCM restarts it and startup recovery restores.
          Ctl start --duration unlimited --ack-ventilation
          $old = (Get-Process -Name Nightshift.Service).Id
          Stop-Process -Id $old -Force
          $deadline = (Get-Date).AddSeconds(90)
          do {
            Start-Sleep -Seconds 2
            $p = Get-Process -Name Nightshift.Service -ErrorAction SilentlyContinue
          } until (($p -and $p.Id -ne $old -and (Get-Service NightshiftService).Status -eq 'Running') -or (Get-Date) -gt $deadline)
          if (-not $p -or $p.Id -eq $old) { throw 'Service was not restarted by the SCM' }
          Start-Sleep -Seconds 3
          $status = & $ctl status --json | ConvertFrom-Json
          if ($status.active.sessionId) { throw 'Interrupted session is still active' }
          if ($status.last.status -ne 'Interrupted') { throw "Expected last session Interrupted, got $($status.last.status)" }
          if ((Settings) -ne $before) { throw 'Settings not restored after crash recovery' }
          $sys = & $ctl system --json | ConvertFrom-Json
          if ($sys.service.previousShutdownClean -ne $false) { throw 'Unclean shutdown not detected' }

          ./installer/uninstall-service.ps1 -RemoveData
          if (Get-Service NightshiftService -ErrorAction SilentlyContinue) { throw 'Service still installed' }
      - name: service diagnostics
        if: failure()
        shell: pwsh
        run: |
          sc.exe qc NightshiftService
          sc.exe qprivs NightshiftService
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = 'NightshiftService', '.NET Runtime', 'Application Error' } -MaxEvents 60 -ErrorAction SilentlyContinue |
            Format-List TimeCreated, ProviderName, LevelDisplayName, Message
      - uses: actions/upload-artifact@v4
        with:
          name: nightshift-win-x64
          path: |
            out/nightshift-poc.exe
            out/service
            out/ctl
            installer
